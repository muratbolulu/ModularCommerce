services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: modularcommerce-sql
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "Your_strong_Password123"
    ports:
      - "1433:1433"
    healthcheck:
      test: [ "CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P Your_strong_Password123 -Q 'SELECT 1' || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    container_name: modularcommerce-redis
    ports:
      - "6379:6379"

  auth-api:
    build:
      context: .
      dockerfile: src/Services/Auth/Auth.Api/Dockerfile
    container_name: modularcommerce-auth
    environment:
      ASPNETCORE_URLS: "http://+:8080"
      AUTH_DB_CONNECTION: "Server=sqlserver,1433;Database=AuthDb;User Id=sa;Password=Your_strong_Password123;TrustServerCertificate=True;"
      JWT_ISSUER: "modular-commerce"
      JWT_AUDIENCE: "modular-commerce-clients"
      JWT_SIGNING_KEY: "development-signing-key-please-change"
    depends_on:
      - sqlserver
    ports:
      - "5001:8080"

  product-api:
    build:
      context: .
      dockerfile: src/Services/Product/Product.Api/Dockerfile
    container_name: modularcommerce-product
    environment:
      ASPNETCORE_URLS: "http://+:8080"
      PRODUCT_DB_CONNECTION: "Server=sqlserver,1433;Database=ProductDb;User Id=sa;Password=Your_strong_Password123;TrustServerCertificate=True;"
      REDIS_CONNECTION: "redis:6379"
      JWT_ISSUER: "modular-commerce"
      JWT_AUDIENCE: "modular-commerce-clients"
      JWT_SIGNING_KEY: "development-signing-key-please-change"
    depends_on:
      - sqlserver
      - redis
    ports:
      - "5002:8080"

  log-api:
    build:
      context: .
      dockerfile: src/Services/Log/Log.Api/Dockerfile
    container_name: modularcommerce-log
    environment:
      ASPNETCORE_URLS: "http://+:8080"
    ports:
      - "5003:8080"

  gateway-api:
    build:
      context: .
      dockerfile: src/Gateway/Gateway.Api/Dockerfile
    container_name: modularcommerce-gateway
    environment:
      ASPNETCORE_URLS: "http://+:8080"
      ReverseProxy__Clusters__auth-cluster__Destinations__destination1__Address: "http://auth-api:8080/"
      ReverseProxy__Clusters__product-cluster__Destinations__destination1__Address: "http://product-api:8080/"
      ReverseProxy__Clusters__log-cluster__Destinations__destination1__Address: "http://log-api:8080/"
    depends_on:
      - auth-api
      - product-api
      - log-api
    ports:
      - "5000:8080"
